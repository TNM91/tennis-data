name: Native WebKit release verification

# Verification-only branch: production CI and release gates stay unchanged.
on:
  push:
    branches: [codex/match-brief-linux-20261119]

permissions:
  contents: read

concurrency:
  group: match-brief-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    if: github.repository == 'TNM91/tennis-data'
    name: Native WebKit (part ${{ matrix.part }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked packages
        run: npm ci
      - name: Check the browser image matches the installed test runner
        run: node -e "require('node:assert/strict').equal(require('@playwright/test/package.json').version, '1.59.1')"
      - name: Build the native production bundle
        run: node mobile/scripts/build-bundled.mjs --first-party-full
      - name: Check the complete WebKit navigation shard
        run: >-
          npx playwright test --config=tests/playwright.native-navigation.config.ts
          --project=mobile-webkit --shard=${{ matrix.part }}/2 --workers=2 --retries=0 --max-failures=1
          --global-timeout=900000
          --output=.next/match-brief-linux --reporter=list,github
      - name: Save layout evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: captain-webkit-${{ matrix.part }}-${{ github.sha }}
          path: |
            .next/match-brief-linux/**/captain-*.png
            .next/match-brief-linux/**/error-context.md
            .next/match-brief-linux/**/test-failed-*.png
            .next/match-brief-linux/**/trace.zip
          if-no-files-found: ignore
          retention-days: 3
