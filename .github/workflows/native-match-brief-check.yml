name: Native Match brief layout check

# Verification-only branch: production CI and release gates stay unchanged.
on:
  push:
    branches: [codex/match-brief-linux-20261119]

permissions:
  contents: read

concurrency:
  group: match-brief-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    if: github.repository == 'TNM91/tennis-data'
    name: Match brief layout (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked packages
        run: npm ci
      - name: Check the browser image matches the installed test runner
        run: node -e "require('node:assert/strict').equal(require('@playwright/test/package.json').version, '1.59.1')"
      - name: Build the native production bundle
        run: node mobile/scripts/build-bundled.mjs --first-party-full
      - name: Check captain follow-ups, reminders, large text and return focus
        run: >-
          npx playwright test --config=tests/playwright.native-navigation.config.ts
          --project=mobile-chrome --project=mobile-webkit --workers=1 --retries=0
          --global-timeout=180000
          --grep='captain assignment follow-up view|captain assignment follow-ups target|captain confirmation reminders protect|team match brief caches an explicit check|team match brief drops stale counts'
          --output=.next/match-brief-linux --reporter=list,github
      - name: Save layout evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: match-brief-linux-layout-${{ github.sha }}
          path: .next/match-brief-linux/
          if-no-files-found: ignore
          retention-days: 3
