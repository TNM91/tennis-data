name: Mobile iOS simulator build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  listing-captures:
    if: github.repository == 'TNM91/tennis-data' && github.ref == 'refs/heads/codex/ios-listing-capture-273'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - name: Prepare and verify the first-party app
        run: |
          npm ci
          npm ci --prefix mobile
          npm run build:bundled --prefix mobile -- --first-party-full
          npm run prepare:ios --prefix mobile
          npm run check:ios --prefix mobile -- --first-party-full
      - name: Start the large iPhone before compiling
        run: bash mobile/scripts/capture-ios-listing.sh boot
      - name: Compile the unsigned screenshot app with isolated sample data
        run: |
          set -euo pipefail
          node mobile/scripts/prepare-ios-listing-captures.mjs mobile/ios/App/App
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/tiq-listing" CODE_SIGNING_ALLOWED=NO build -quiet
      - name: Capture Team Chat and Coach & Training on a large iPhone
        timeout-minutes: 10
        run: bash mobile/scripts/capture-ios-listing.sh
      - name: Retain only the sample screenshots
        uses: actions/upload-artifact@v6
        with:
          name: tenaceiq-first-party-iphone-listing-273
          path: ${{ runner.temp }}/tiq-listing-screens/*.jpg
          if-no-files-found: error
          retention-days: 3
      - name: Retain simulator diagnostics if a capture fails
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: tenaceiq-first-party-iphone-capture-diagnostics
          path: ${{ runner.temp }}/tiq-listing-diagnostics/*.jpg
          if-no-files-found: ignore
          retention-days: 2
