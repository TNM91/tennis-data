name: Mobile iOS signed build

# Credentials must be scoped to the apple-testflight environment. Never add a
# pull_request trigger or check out an arbitrary input ref in this workflow.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Unique positive build number (at most nine digits)
        required: true
        type: string
      upload:
        description: Upload the signed build to App Store Connect
        type: boolean
        default: false
      distribution:
        description: App Store upload is available only from master
        type: choice
        default: internal
        options:
          - internal
          - app-store
      profile:
        description: App profile to build
        type: choice
        default: standard
        options: [standard, first-party]
permissions:
  contents: read
concurrency:
  group: apple-testflight
  cancel-in-progress: false
jobs:
  signed:
    if: >-
      github.repository == 'TNM91/tennis-data' &&
      ((inputs.profile == 'standard' &&
        (github.ref == 'refs/heads/master' || (github.ref == 'refs/heads/codex/apple-mobile-build' && inputs.distribution == 'internal')) &&
        (inputs.distribution == 'internal' || (inputs.distribution == 'app-store' && inputs.upload))) ||
       (inputs.profile == 'first-party' && github.ref == 'refs/heads/codex/ios-first-party-release' &&
        inputs.distribution == 'internal' && (!inputs.upload || inputs.build_number == '255')))
    permissions:
      contents: read
      actions: read
    environment: apple-testflight
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      TIQ_IOS_DISTRIBUTION: ${{ inputs.distribution }}
      TIQ_IOS_PROFILE: ${{ inputs.profile }}
      TIQ_IOS_PROJECT: ${{ inputs.profile == 'first-party' && 'mobile/ios-first-party/App/App.xcodeproj' || 'mobile/ios/App/App.xcodeproj' }}
      TIQ_BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        if: inputs.profile != 'first-party' || !inputs.upload
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - name: Prepare bundled native app
        if: inputs.profile != 'first-party' || !inputs.upload
        run: |
          npm ci
          npm ci --prefix mobile
          node --test mobile/scripts/ios-purchases.test.mjs mobile/scripts/ios-workflow.test.mjs mobile/scripts/ios-store.test.mjs mobile/scripts/ios-icon.test.mjs mobile/scripts/ios-push.test.mjs
          python3 mobile/scripts/test-altool-upload.py
          python3 mobile/scripts/test-ios-export-options.py
          if test "$TIQ_IOS_PROFILE" = first-party; then
            npm run build:ios:first-party --prefix mobile
            npm run prepare:ios:first-party --prefix mobile
            npm run check:ios:first-party --prefix mobile
            node mobile/scripts/prepare-ios-store.mjs --first-party
          else
            npm run build:bundled --prefix mobile
            npm run prepare:ios --prefix mobile
            npm run check:ios --prefix mobile
            node mobile/scripts/prepare-ios-store.mjs
          fi
      - name: Import signing material and validate profile
        if: inputs.profile != 'first-party' || !inputs.upload
        env:
          CERTIFICATE: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$CERTIFICATE" && test -n "$CERTIFICATE_PASSWORD" && test -n "$PROFILE"
          mkdir -p "$RUNNER_TEMP/tiq-signing"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/tiq-signing/distribution.p12"
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/tiq-signing/app.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/tiq-signing/app.mobileprovision" > "$RUNNER_TEMP/tiq-signing/profile.plist"
          python3 mobile/scripts/validate-ios-profile.py "$RUNNER_TEMP/tiq-signing/profile.plist" "$RUNNER_TEMP/tiq-signing" "$TIQ_IOS_DISTRIBUTION"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/tiq-signing/build.keychain-db"
          security set-keychain-settings -lut 3600 "$RUNNER_TEMP/tiq-signing/build.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/tiq-signing/build.keychain-db"
          security import "$RUNNER_TEMP/tiq-signing/distribution.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/tiq-signing/build.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/tiq-signing/build.keychain-db" > /dev/null
          security list-keychains -d user -s "$RUNNER_TEMP/tiq-signing/build.keychain-db" "$HOME/Library/Keychains/login.keychain-db"
          openssl x509 -inform DER -in "$RUNNER_TEMP/tiq-signing/profile-certificate.cer" -noout -fingerprint -sha1 > "$RUNNER_TEMP/tiq-signing/fingerprint.txt"
          FINGERPRINT=$(cut -d= -f2 "$RUNNER_TEMP/tiq-signing/fingerprint.txt" | tr -d ':')
          security find-identity -v -p codesigning "$RUNNER_TEMP/tiq-signing/build.keychain-db" | grep -q "$FINGERPRINT"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/tiq-signing/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$(cat "$RUNNER_TEMP/tiq-signing/uuid").mobileprovision"
      - name: Archive and export signed IPA
        if: inputs.profile != 'first-party' || !inputs.upload
        run: |
          set -euo pipefail
          xcodebuild -help > "$RUNNER_TEMP/tiq-xcode-help.txt" 2>&1
          python3 -c 'import pathlib,sys; assert "testFlightInternalTestingOnly" in pathlib.Path(sys.argv[1]).read_text(), "Xcode internal-only export option unavailable"' "$RUNNER_TEMP/tiq-xcode-help.txt"
          TEAM=$(cat "$RUNNER_TEMP/tiq-signing/team")
          UUID=$(cat "$RUNNER_TEMP/tiq-signing/uuid")
          echo "::add-mask::$TEAM"
          echo "::add-mask::$UUID"
          xcodebuild -project "$TIQ_IOS_PROJECT" -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/tiq-app.xcarchive" \
            TIQ_APP_TEAM="$TEAM" TIQ_APP_PROFILE="$UUID" archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/tiq-app.xcarchive" \
            -exportPath "$RUNNER_TEMP/tiq-export" -exportOptionsPlist "$RUNNER_TEMP/tiq-signing/export.plist"
          codesign --verify --deep --strict "$RUNNER_TEMP/tiq-app.xcarchive/Products/Applications/App.app"
          IPA="$RUNNER_TEMP/tiq-export/App.ipa"
          if test "$TIQ_IOS_PROFILE" = first-party; then
            unzip -q "$IPA" 'Payload/App.app/*' -d "$RUNNER_TEMP/tiq-ipa-validation"
            APP="$RUNNER_TEMP/tiq-ipa-validation/Payload/App.app"
            codesign --verify --deep --strict "$APP"
            codesign --display --entitlements - --xml "$APP" > "$RUNNER_TEMP/tiq-signing/offline-entitlements.plist"
            python3 mobile/scripts/validate-ios-distribution.py "$TIQ_IOS_DISTRIBUTION" "$TIQ_BUILD_NUMBER" "$IPA" "$RUNNER_TEMP/tiq-signing/export.plist" mobile/bundled-first-party --first-party "$RUNNER_TEMP/tiq-signing/offline-entitlements.plist"
          else
            python3 mobile/scripts/validate-ios-privacy.py "$RUNNER_TEMP/tiq-app.xcarchive/Products/Applications/App.app/Info.plist"
            python3 mobile/scripts/validate-ios-distribution.py "$TIQ_IOS_DISTRIBUTION" "$TIQ_BUILD_NUMBER" "$IPA" "$RUNNER_TEMP/tiq-signing/export.plist" mobile/bundled
          fi
      - name: Retrieve and verify approved offline IPA
        if: inputs.profile == 'first-party' && inputs.upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_RUN=42749137524
          SOURCE_SHA=4bf00ab4b55935dd22b93e269cc39d66c8110583
          IPA_SHA256=6da7e12cce8e4e07f28da181c0d2d76a1f5780a5e428d3a47b9de4214c5c2b08
          SOURCE=$(gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json headSha,conclusion --jq '.headSha + ":" + .conclusion')
          test "$SOURCE" = "$SOURCE_SHA:success"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name tenaceiq-ios-first-party-signed-255 --dir "$RUNNER_TEMP/tiq-export"
          printf '%s  %s\n' "$IPA_SHA256" "$RUNNER_TEMP/tiq-export/App.ipa" | shasum -a 256 -c -
      - name: Upload to App Store Connect
        if: inputs.upload
        env:
          API_KEY: ${{ secrets.APPLE_UPLOAD_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_UPLOAD_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_UPLOAD_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$API_KEY" && test -n "$API_KEY_ID" && test -n "$API_ISSUER"
          mkdir -p "$RUNNER_TEMP/tiq-api"
          printf '%s' "$API_KEY" | base64 --decode > "$RUNNER_TEMP/tiq-api/AuthKey_${API_KEY_ID}.p8"
          API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/tiq-api" xcrun altool --upload-app \
            --file "$RUNNER_TEMP/tiq-export/App.ipa" --type ios --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER" \
            --output-format json > "$RUNNER_TEMP/tiq-upload.json"
          python3 mobile/scripts/validate-altool-upload.py "$RUNNER_TEMP/tiq-upload.json"
      - name: Save signed app only
        if: inputs.distribution == 'internal' && (inputs.profile != 'first-party' || !inputs.upload)
        uses: actions/upload-artifact@v6
        with:
          name: tenaceiq-ios-${{ inputs.profile == 'first-party' && 'first-party-signed' || 'signed' }}-${{ inputs.build_number }}
          path: ${{ runner.temp }}/tiq-export/App.ipa
          if-no-files-found: error
          retention-days: 3
      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/tiq-signing/build.keychain-db" 2>/dev/null || true
          if test -f "$RUNNER_TEMP/tiq-signing/uuid"; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$(cat "$RUNNER_TEMP/tiq-signing/uuid").mobileprovision"
          fi
          rm -rf "$RUNNER_TEMP/tiq-signing" "$RUNNER_TEMP/tiq-api" "$RUNNER_TEMP/tiq-ipa-validation"

