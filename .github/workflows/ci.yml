name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-navigation-diagnostics:
    if: github.repository == 'TNM91/tennis-data' && github.ref == 'refs/heads/codex/qa-native-navigation-270'
    name: Native navigation diagnostics (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Use the Ubuntu archive for browser dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
      - name: Install locked dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Bundle the installed app
        run: npm run build:bundled --prefix mobile
      - name: Record individual navigation outcomes
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4283
        run: >-
          npx playwright test --config=tests/playwright.native-navigation.config.ts
          --project=mobile-chrome --workers=2 --shard=1/2 --max-failures=3
          --reporter=list,github --output=.next/navigation-results
