name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-navigation-follow-up:
    if: github.repository == 'TNM91/tennis-data' && github.ref == 'refs/heads/codex/qa-native-navigation-270'
    name: Native navigation follow-up (WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Use the Ubuntu archive for browser dependencies
        run: |
          # Preserve signed Ubuntu packages while avoiding the throttled Azure mirror.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
      - name: Install locked dependencies and browser engine
        run: |
          npm ci
          npx playwright install --with-deps webkit
      - name: Bundle the installed app
        run: npm run build:bundled --prefix mobile
      - name: Verify onboarding and score recovery
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4283
        run: >-
          npx playwright test --config=tests/playwright.native-navigation.config.ts
          --project=mobile-webkit --workers=1 --output=.next/navigation-results --reporter=list,github
          -g 'doubles corrections survive a lost receipt|first player setup stays usable'
