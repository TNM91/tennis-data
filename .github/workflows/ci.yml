name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-webkit-qa:
    if: github.repository == 'TNM91/tennis-data' && github.ref == 'refs/heads/codex/qa-native-tournament-heading'
    name: Native tournament and navigation WebKit QA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Use the Ubuntu archive for browser dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
      - name: Install locked dependencies and WebKit
        run: |
          npm ci
          npx playwright install --with-deps webkit
      - name: Bundle the installed app
        run: npm run build:bundled --prefix mobile
      - name: Verify compact tournament and league search
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4266
        run: >-
          npx playwright test tests/e2e/mobile-tournaments.e2e.ts tests/e2e/mobile-competitions.e2e.ts
          --project=mobile-webkit --workers=1
          -g 'tournament search lets players edit|tournament browse return|published event, division|league browse return|league search and result evidence'
      - name: Verify Coach and My Lab navigation
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4283
        run: >-
          npx playwright test --config=tests/playwright.native-navigation.config.ts --project=mobile-webkit --workers=1
          -g 'A coach update opens|Updates targets the requested Coach conversation|Coach feedback opens|Coach check-in keeps the pack review|first-party player opens their captain-posted courts|first-party My Lab flags a changed team score'
