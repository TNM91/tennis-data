name: CI
on: workflow_dispatch
permissions:
  contents: read
jobs:
  court-layout-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Use the Ubuntu browser dependency mirror
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run build:bundled --prefix mobile
      - name: Measure short-screen WebKit geometry
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4283
        run: npx playwright test --config=tests/playwright.court-diagnostic.config.ts --grep="Court geometry diagnostic" --project=mobile-webkit --workers=1 --reporter=list --output=.next/court-diagnostic
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: court-layout-diagnostic-${{ github.sha }}
          path: .next/court-diagnostic/**/*
          if-no-files-found: error
          retention-days: 3
