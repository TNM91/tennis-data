name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  narrow-navigation-regressions:
    if: github.repository == 'TNM91/tennis-data' && github.ref == 'refs/heads/codex/qa-native-navigation-270'
    name: Narrow navigation regression checks (Linux Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Use the Ubuntu archive for browser dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
      - name: Install locked dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Bundle the installed app
        run: npm run build:bundled --prefix mobile
      - name: Verify court filters and Coach shortcut return
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4283
        run: >-
          npx playwright test --config=tests/playwright.native-navigation.config.ts
          --project=mobile-chrome --workers=2 --reporter=list,github
          -g 'first-party My Lab opens account notes|filters listed courts while preserving|My Lab shortcuts fit the screen|filters team results to their own courts'
